syntax = "proto3"; //版本

package fixbug; //声明代码所在包 对于cpp来说是namespace

option cc_generic_services = true;

message Resultcode {
    int32 errcode = 1;
    bytes errmsg = 2;
}
message LoginRequest{
    bytes name = 1;
    bytes pwd = 2;
}
    
message LoginResponse {
    Resultcode result = 1;
    bool success = 2;
}

message GetFriendListRequest {
    uint32 userid = 1;
}

message User {
    bytes name = 1;
    uint32 age = 2;
    enum Sex {
        MAN = 0;
        WOMAN = 1;
    }
    Sex sex = 3;
}

message GetFriendListResponse {
    Resultcode result = 1;
    repeated User friend_list = 2;
}

//在protobuf怎么定义描述rpc方法类型  service
service UserServiceRpc 
{
    // 用户登录
    rpc Login(LoginRequest) returns(LoginResponse);
    // 获取好友列表
    rpc GetFriendList(GetFriendListRequest) returns(GetFriendListResponse);
}